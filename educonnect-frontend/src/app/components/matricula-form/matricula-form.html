<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <h2>Registrar Nueva Matrícula</h2>
    </div>
    <div class="card-body">
      <form (ngSubmit)="guardarMatricula()">
        
        <div class="mb-3">
          <label class="form-label">ID del Estudiante</label>
          <input type="number" class="form-control" name="estudianteId" [(ngModel)]="nuevaMatricula.estudianteId" required>
        </div>

        <div class="mb-3">
          <label class="form-label">ID del Profesor</label>
          <input type="number" class="form-control" name="profesorId" [(ngModel)]="nuevaMatricula.profesorId" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Nombre del Curso</label>
          <input type="text" class="form-control" name="nombreCurso" [(ngModel)]="nuevaMatricula.nombreCurso" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Créditos</label>
          <input type="number" class="form-control" name="creditos" [(ngModel)]="nuevaMatricula.creditos" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Periodo (Ej. II-2026)</label>
          <input type="text" class="form-control" name="periodo" [(ngModel)]="nuevaMatricula.periodo" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Monto Arancel</label>
          <input type="number" class="form-control" name="montoArancel" [(ngModel)]="nuevaMatricula.montoArancel" required>
        </div>

        <button type="submit" class="btn btn-success">Guardar Matrícula</button>
        <button type="button" class="btn btn-secondary ms-2" routerLink="/matriculas">Cancelar</button>
      </form>
    </div>
  </div>
</div>
